repos:
  - repo: https://github.com/psf/black.git
    rev: "24.10.0"
    hooks:
      - id: black

  - repo: https://github.com/asottile/pyupgrade
    rev: "v3.19.0"
    hooks:
      - id: pyupgrade
        args: [--py39-plus]

  - repo: https://github.com/pycqa/isort
    rev: "5.13.2"
    hooks:
      - id: isort
        entry: isort
        args:
          - --profile=black 
          - --float-to-top
